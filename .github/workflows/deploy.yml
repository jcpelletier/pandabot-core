name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PANDA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PANDA_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          ssh ${{ secrets.PANDA_USER }}@${{ secrets.PANDA_HOST }} \
            "sudo git -C /opt/pandabot-core pull origin main && \
             sudo systemctl restart discord-bot pandaqa"

      - name: Post-deploy health check
        run: |
          sleep 15
          ssh ${{ secrets.PANDA_USER }}@${{ secrets.PANDA_HOST }} \
            "sudo systemctl is-active discord-bot pandaqa"
